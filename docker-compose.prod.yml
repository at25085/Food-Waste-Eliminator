# Production on one server (e.g. Vultr): the app + Caddy for HTTPS.
#   DOMAIN=yourname.tech in backend/.env → Caddy fetches a certificate automatically.
# Models, plans and training data live on the host (./artifacts, ./data), so uploads and
# retrains made in the demo survive restarts. The database is Tiger Cloud (DATABASE_URL).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/processed:/app/data/processed
      - ./data/cache:/app/data/cache
    expose:
      - "8000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: backend/.env
    ports:
      - "80:80"
      - "443:443"
    # DOMAIN (from backend/.env) set: HTTPS for DOMAIN and www.DOMAIN; unset: plain HTTP on port 80.
    command:
      - sh
      - -c
      - |
        if [ -n "$$DOMAIN" ]; then SITE="$$DOMAIN, www.$$DOMAIN"; else SITE=":80"; fi
        printf '%s {\n\treverse_proxy app:8000\n}\n' "$$SITE" > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
    depends_on:
      - app
volumes:
  caddy_data:
